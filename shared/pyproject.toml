[project]
name = "mcp-shared"
version = "0.1.0"
description = "Eventos e schemas compartilhados entre o orchestrator e os servidores MCP de domínio"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_shared*"]
